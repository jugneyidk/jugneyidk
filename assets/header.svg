<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Jugney Vargas - GitHub profile header</title>
  <desc id="desc">Dark technological header for Jugney Vargas, developer of web, mobile and realtime systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b16"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#94a3b8" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <circle cx="1030" cy="72" r="150" fill="#22d3ee" opacity="0.10" filter="url(#glow)"/>
  <circle cx="980" cy="278" r="110" fill="#8b5cf6" opacity="0.16" filter="url(#glow)"/>
  <circle cx="188" cy="292" r="160" fill="#14b8a6" opacity="0.09" filter="url(#glow)"/>

  <path d="M760 78h210l62 62v116l-62 62H760l-62-62V140z" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.75"/>
  <path d="M808 144h185M808 184h140M808 224h168" stroke="#a5f3fc" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  <circle cx="744" cy="140" r="6" fill="#22d3ee"/>
  <circle cx="744" cy="256" r="6" fill="#8b5cf6"/>
  <path d="M744 140H620M744 256H620M620 140v116" stroke="#38bdf8" stroke-width="2" opacity="0.55"/>

  <text x="72" y="118" fill="#67e8f9" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="18" letter-spacing="3">@JUGNEYIDK</text>
  <text x="72" y="178" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">Jugney Vargas</text>
  <text x="76" y="226" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Web, mobile, realtime systems and automation</text>

  <g transform="translate(76 266)">
    <rect width="118" height="32" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="18" y="22" fill="#e0f2fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">PHP / MySQL</text>
    <rect x="134" width="128" height="32" rx="16" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.45"/>
    <text x="152" y="22" fill="#ede9fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">React Native</text>
    <rect x="278" width="112" height="32" rx="16" fill="#0f172a" stroke="#14b8a6" stroke-opacity="0.45"/>
    <text x="296" y="22" fill="#ccfbf1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">WebSockets</text>
    <rect x="406" width="98" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="424" y="22" fill="#e0f2fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Python</text>
  </g>

  <path d="M0 326 C180 288 312 360 502 318 C694 276 782 314 964 292 C1078 278 1148 286 1200 304 V360 H0z" fill="url(#accent)" opacity="0.16"/>
</svg>
